apiVersion: apps/v1
kind: Deployment
metadata:
  name: pota-api
  namespace: potamap
  labels:
    app.kubernetes.io/name: pota-api
    app.kubernetes.io/part-of: potamap
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: pota-api
  template:
    metadata:
      labels:
        app.kubernetes.io/name: pota-api
        app.kubernetes.io/part-of: potamap
    spec:
      automountServiceAccountToken: false
      nodeSelector:
        kubernetes.io/hostname: spainip-k3s
      imagePullSecrets:
        - name: registry-credentials
      containers:
        - name: pota-api
          image: ghcr.io/ea7klk/pota-api:latest
          imagePullPolicy: Always
          ports:
            - name: http
              containerPort: 3000
          env:
            - name: NODE_ENV
              value: production
            - name: PORT
              value: "3000"
            - name: PARK_REFRESH_MS
              value: "21600000"
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 3
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 10
            periodSeconds: 20
            timeoutSeconds: 3
          resources:
            requests:
              cpu: 25m
              memory: 64Mi
            limits:
              cpu: 250m
              memory: 256Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            capabilities:
              drop: [ALL]
---
apiVersion: v1
kind: Service
metadata:
  name: pota-api
  namespace: potamap
  labels:
    app.kubernetes.io/name: pota-api
    app.kubernetes.io/part-of: potamap
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: pota-api
  ports:
    - name: http
      port: 80
      targetPort: http
