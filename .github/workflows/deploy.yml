name: Deploy to potamap namespace

on:
  workflow_dispatch:
    inputs:
      image_tag:
        description: Image tag to deploy
        required: true
        default: latest

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Configure kubeconfig
        env:
          KUBECONFIG_B64: ${{ secrets.KUBECONFIG_B64 }}
        run: |
          mkdir -p "$HOME/.kube"
          printf '%s' "$KUBECONFIG_B64" | base64 --decode > "$HOME/.kube/config"
      - name: Apply internal service
        env:
          IMAGE_TAG: ${{ inputs.image_tag }}
        run: |
          sed -i "s#ghcr.io/ea7klk/pota-api:latest#ghcr.io/ea7klk/pota-api:${IMAGE_TAG}#" k8s/deployment.yaml
          kubectl apply -f k8s/deployment.yaml
          kubectl -n potamap rollout status deployment/pota-api --timeout=180s
