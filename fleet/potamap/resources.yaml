apiVersion: apps/v1
kind: Deployment
metadata:
  name: pota-api
  namespace: potamap
  annotations:
    helm.sh/resource-policy: keep
  labels:
    app.kubernetes.io/name: pota-api
    app.kubernetes.io/part-of: potamap
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: pota-api
  template:
    metadata:
      labels:
        app.kubernetes.io/name: pota-api
        app.kubernetes.io/part-of: potamap
    spec:
      automountServiceAccountToken: false
      nodeSelector:
        kubernetes.io/hostname: spainip-k3s
      imagePullSecrets:
        - name: registry-credentials
      containers:
        - name: pota-api
          image: ghcr.io/ea7klk/pota-api@sha256:0e69a199f9a921c8322b26dd2b243a324f382c24c3bcbd23a62057c7a5a451bd
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 3000
          env:
            - name: NODE_ENV
              value: production
            - name: PORT
              value: "3000"
            - name: PARK_REFRESH_MS
              value: "21600000"
            - name: SPOTS_REFRESH_MS
              value: "30000"
            - name: SPOTS_CACHE_TTL_MS
              value: "45000"
            - name: REDIS_URL
              value: redis://pota-redis:6379
            - name: REDIS_TIMEOUT_MS
              value: "500"
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 3
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 10
            periodSeconds: 20
            timeoutSeconds: 3
          resources:
            requests:
              cpu: 25m
              memory: 64Mi
            limits:
              cpu: 250m
              memory: 256Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            capabilities:
              drop: [ALL]
---
apiVersion: v1
kind: Service
metadata:
  name: pota-api
  namespace: potamap
  annotations:
    helm.sh/resource-policy: keep
  labels:
    app.kubernetes.io/name: pota-api
    app.kubernetes.io/part-of: potamap
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: pota-api
  ports:
    - name: http
      port: 80
      targetPort: http
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: pota-redis
  namespace: potamap
  annotations:
    helm.sh/resource-policy: keep
  labels:
    app.kubernetes.io/name: pota-redis
    app.kubernetes.io/part-of: potamap
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: pota-redis
  template:
    metadata:
      labels:
        app.kubernetes.io/name: pota-redis
        app.kubernetes.io/part-of: potamap
    spec:
      automountServiceAccountToken: false
      nodeSelector:
        kubernetes.io/hostname: spainip-k3s
      containers:
        - name: redis
          image: redis:7.4-alpine
          args:
            - redis-server
            - --save
            - ""
            - --appendonly
            - "no"
            - --maxmemory
            - 64mb
            - --maxmemory-policy
            - allkeys-lru
          ports:
            - name: redis
              containerPort: 6379
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              cpu: 100m
              memory: 128Mi
          securityContext:
            allowPrivilegeEscalation: false
            runAsNonRoot: true
            capabilities:
              drop: [ALL]
          readinessProbe:
            tcpSocket:
              port: redis
            initialDelaySeconds: 3
            periodSeconds: 5
          livenessProbe:
            tcpSocket:
              port: redis
            initialDelaySeconds: 10
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: pota-redis
  namespace: potamap
  annotations:
    helm.sh/resource-policy: keep
  labels:
    app.kubernetes.io/name: pota-redis
    app.kubernetes.io/part-of: potamap
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: pota-redis
  ports:
    - name: redis
      port: 6379
      targetPort: redis
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: pota-redis-ingress
  namespace: potamap
  annotations:
    helm.sh/resource-policy: keep
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: pota-redis
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: pota-api
      ports:
        - protocol: TCP
          port: 6379
